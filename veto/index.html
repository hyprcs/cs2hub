:root {
  --bg: #0d1117; --s1: #161b22; --s2: #1c232c; --s3: #242d38;
  --line: #2d3743; --text: #e6edf3; --t2: #b1bac4; --t3: #8b949e;
  --a: #58a6ff; --b: #f0883e; --dec: #bc8cff; --ban: #3a4350; --pick: #2fbfb0;
  --good: #3fb950; --bad: #f85149; --warn: #d29922; --focus: #79c0ff;
  --num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; }
[hidden] { display: none !important; }
a { color: var(--a); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--s2); padding: 6px 10px; z-index: 50; }
.top { background: var(--s1); }
.tabbar { background: var(--s1); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topin { max-width: 1240px; margin: 0 auto; padding: 14px 16px 6px; display: flex;
  gap: 16px; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; }
.kicker { font: 700 12px/1 var(--num); letter-spacing: .14em; color: var(--a); }
h1 { font: 700 28px/1.1 var(--num); margin: 4px 0 2px; letter-spacing: .01em; }
.tag { margin: 0; color: var(--t2); font-size: 14px; max-width: 640px; }
.fresh { color: var(--t3); font-size: 13px; text-align: right; }
.tabs { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 14px; color: var(--t2); font-weight: 600; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--a); }
.tabs button:hover { color: var(--text); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
.card { background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
h2 { font: 700 19px/1.2 var(--num); margin: 0 0 10px; letter-spacing: .02em; }
h3 { font-size: 15px; margin: 0 0 6px; }
.note { color: var(--t3); font-size: 13px; margin: 8px 0 0; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.grid > .card { margin-bottom: 0; }
@media (min-width: 980px) { .grid { grid-template-columns: 1.15fr 1fr; } }
.grid + .card { margin-top: 16px; }
.dim { color: var(--t3); }
.num { font-family: var(--num); font-weight: 700; }
.ca { color: var(--a); } .cb { color: var(--b); } .cd { color: var(--dec); }
/* ---- upcoming ---- */
.uhead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.uhead p { margin: 0; color: var(--t2); font-size: 14px; }
.day { font: 700 16px/1.2 var(--num); letter-spacing: .06em; color: var(--t2); margin: 18px 0 8px; text-transform: uppercase; }
.ugrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.ucard { background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.umeta { color: var(--t3); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--t2); }
.uteams { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 16px; }
.uteams .vs { color: var(--t3); font-weight: 400; }
.mrow { display: grid; grid-template-columns: 74px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
.mname { color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtrack { height: 10px; background: var(--s3); border-radius: 5px; overflow: hidden; display: flex; }
.mtrack span { display: block; height: 100%; }
.mp { text-align: right; font-family: var(--num); font-weight: 700; font-size: 15px; }
.mtop .mname { color: var(--text); font-weight: 600; }
.ulines { font-size: 13px; color: var(--t2); display: grid; gap: 2px; }
.ulines b { color: var(--text); font-weight: 600; }
.ubtn { align-self: flex-start; background: var(--s2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.ubtn:hover { border-color: var(--a); }
.empty { color: var(--t2); padding: 24px; text-align: center; }
/* ---- explore: controls ---- */
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.tpick { position: relative; min-width: 0; }
.flabel { display: block; font-size: 12px; color: var(--t3); margin-bottom: 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.tbtn { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--s2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.tbtn.a { border-left: 4px solid var(--a); } .tbtn.b { border-left: 4px solid var(--b); }
.tbtn .tn { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn .ts { color: var(--t3); font-size: 12px; }
.tbtn .tw { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.swap { background: var(--s2); border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; cursor: pointer; margin-bottom: 4px; }
.drop { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--s2); border: 1px solid var(--line);
  border-radius: 8px; z-index: 30; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 360px; display: flex; flex-direction: column; }
.drop input { margin: 8px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 15px; }
.dlist { overflow-y: auto; padding: 0 4px 6px; }
.ditem { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; padding: 7px 8px; border-radius: 6px; cursor: pointer; text-align: left; }
.ditem:hover, .ditem:focus-visible { background: var(--s3); }
.ditem .dr { color: var(--t3); font-size: 13px; }
.opts { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 14px; }
.og { display: flex; flex-direction: column; gap: 4px; }
.segs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.segs button { background: var(--s2); border: 0; border-right: 1px solid var(--line); padding: 5px 11px; cursor: pointer; font-size: 14px; color: var(--t2); }
.segs button:last-child { border-right: 0; }
.segs button[aria-pressed="true"] { background: #1f3a5a; color: var(--text); font-weight: 600; }
.segs button:disabled { opacity: .45; cursor: not-allowed; }
.ohint { font-size: 12px; color: var(--t3); }
.moreopts { flex: 1 1 100%; }
.moreopts > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--t2); padding: 4px 0; }
.moreopts > summary .dim { font-weight: 400; margin-left: 6px; }
.optin { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 8px; }
/* ---- explore: answer ---- */
.answer { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 760px) { .answer { grid-template-columns: 1.4fr 1fr; } }
.alabel { font-size: 12px; color: var(--t3); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.aset { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--s2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 600; }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.big { font: 700 34px/1 var(--num); }
.alts { font-size: 14px; color: var(--t2); display: grid; gap: 3px; }
.alts .num { font-size: 16px; color: var(--text); }
.assume { font-size: 13px; color: var(--t3); }
/* ---- explore: board ---- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--t2); margin-bottom: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.brow { display: grid; grid-template-columns: 82px 1fr 58px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.brow:first-child { border-top: 0; }
.bname { font-weight: 600; }
.btrack { height: 18px; display: flex; border-radius: 5px; overflow: hidden; background: var(--s3); }
.btrack span { display: block; height: 100%; }
.bp { text-align: right; }
.bp .num { font-size: 20px; display: block; line-height: 1; }
.bp small { color: var(--t3); font-size: 11px; }
.bsub { grid-column: 2 / 4; font-size: 12px; color: var(--t3); margin-top: -2px; }
/* ---- explore: walkthrough ---- */
.wtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 14px; }
.wstep { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.wstep:first-of-type { border-top: 0; }
.wn { font: 700 16px/1.6 var(--num); color: var(--t3); }
.wwho { font-size: 14px; margin-bottom: 4px; }
.wopts { display: flex; flex-wrap: wrap; gap: 6px; }
.wopt { background: var(--s2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; cursor: default; color: var(--t2); }
.wopt b { color: var(--text); font-family: var(--num); font-size: 15px; margin-left: 4px; }
.wnext .wopt { cursor: pointer; border-color: #3b5673; }
.wnext .wopt:hover { border-color: var(--a); background: #1b2d42; }
.wlater .wopt { opacity: .7; }
.wdone { font-size: 14px; }
.wdone .ok { color: var(--good); font-weight: 700; }
.wundo { background: none; border: 0; color: var(--a); cursor: pointer; font-size: 13px; padding: 0 4px; }
.wreset { background: var(--s2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
/* ---- explore: tendencies ---- */
.tgrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .tgrid { grid-template-columns: 1fr 1fr; } }
.tteam h3 { display: flex; align-items: center; gap: 8px; }
.tteam .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.tline { font-size: 14px; color: var(--t2); margin: 2px 0; }
.tline b { color: var(--text); }
.engine { margin-top: 0; }
/* ---- record ---- */
.rtop { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.headline { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .headline { grid-template-columns: 1fr 1.4fr; } }
.hbig { font: 700 44px/1 var(--num); }
.hsub { color: var(--t2); font-size: 14px; }
.dbar { display: flex; height: 30px; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; }
.dbar span { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #0d1117; min-width: 0; overflow: hidden; white-space: nowrap; }
.dleg { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--t2); }
.dleg i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--s2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .num { font-size: 26px; display: block; line-height: 1.1; }
.tile .tl { font-size: 13px; color: var(--t2); }
.tile .tn { font-size: 12px; color: var(--t3); }
.cover { font-size: 13px; color: var(--t3); margin-top: 12px; }
.rsearch { padding: 7px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-size: 14px; min-width: 220px; }
.receipt { border-top: 1px solid var(--line); scroll-margin-top: 60px; }
.card, .day { scroll-margin-top: 60px; }
.receipt summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 78px 44px 1fr auto; gap: 10px; align-items: center; padding: 9px 4px; }
.receipt summary::-webkit-details-marker { display: none; }
.receipt summary:hover { background: var(--s2); }
.rdate { color: var(--t3); font-size: 13px; }
.rteams { font-weight: 600; min-width: 0; }
.rteams .vs { color: var(--t3); font-weight: 400; }
.rverd { font-size: 13px; text-align: right; white-space: nowrap; }
.rverd .num { font-size: 16px; }
.rtable { width: 100%; border-collapse: collapse; font-size: 14px; margin: 4px 0 12px; }
.rtable th, .rtable td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rtable th { color: var(--t3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.hit { color: var(--good); font-weight: 700; } .miss { color: var(--bad); font-weight: 700; } .na { color: var(--t3); }
.more { margin-top: 10px; background: var(--s2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.foot { text-align: center; color: var(--t3); font-size: 12px; padding: 24px 16px 40px; letter-spacing: .06em; }
@media (max-width: 640px) {
  body { font-size: 15px; }
  .teams { grid-template-columns: 1fr; }
  .swap { justify-self: center; transform: rotate(90deg); }
  .receipt summary { grid-template-columns: 1fr auto; }
  .receipt summary .rdate, .receipt summary .rbo { grid-column: 1 / 2; }
  .rverd { grid-column: 2; grid-row: 1 / 3; }
  .hbig { font-size: 38px; }
  .fresh { text-align: left; }
}</style>
</head>

<script>"use strict";
// Veto inference core -- logit engine mirroring model/veto_sim/sequential.py.
// Cold-inference defaults: h2h_same_action = 0, rank_diff = 0,
// pool_new_flag = 0, days_since_pool_entry = 365.
// Both tables are substituted at build time from the authoritative python
// sources (sequential.MODAL_FLOW / flows.GLOBAL_PRIOR) so the JS copies
// cannot drift. The acting order is an EVENT convention: Majors/RMRs/PGL
// run BO3 ABABBA, ESL-style events ABABAB.
var MODAL_FLOW = {"1":["rrrrrrl","AABBBA"],"3":["rrpprrl","ABABAB"],"5":["rrppppl","ABABAB"]};
var FLOW_ORDERS = {"1":[["AABBBA",0.4107],["ABABAB",0.3579],["ABBAAB",0.2147],["AABBAB",0.0167]],"3":[["ABABAB",0.8237],["ABABBA",0.1763]],"5":[["ABABAB",0.9878],["ABABBA",0.0122]]};
var PRUNE = 1e-4;
var DAYS_CAP = 365;

function buildTeamIndex(teams) {
  var byId = {};
  for (var i = 0; i < teams.length; i++) byId[teams[i].id] = teams[i];
  return byId;
}

// Order-symmetrized starter prior: P(teamA acts first at veto step 1).
// Pure lookup into the python-precomputed table (exact parity with the
// served classifier); 0.5 when the table or either team's HLTV rank is
// missing -- which IS the classifier's own answer there (rank_diff is the
// only order-antisymmetric feature, so symmetrization cancels the rest).
function starterQ(starter, teamA, teamB, bestOf, lan, ev) {
  if (!starter || teamA.r == null || teamB.r == null) return 0.5;
  var d = Math.round(teamA.r - teamB.r);
  if (d > starter.clip) d = starter.clip;
  if (d < -starter.clip) d = -starter.clip;
  var evq = starter.q[ev] || starter.q.other;
  // unknown best_of degrades to the 50/50 convention -- it must NOT
  // silently read the BO1 column (the python mirror raises; 0.5 is the
  // shared degrade both sides agree on)
  var boIdx = -1;
  for (var bi = 0; bi < starter.bos.length; bi++) {
    if (starter.bos[bi] === bestOf) boIdx = bi;
  }
  if (boIdx < 0) return 0.5;
  return evq[lan ? 1 : 0][boIdx][d + starter.clip];
}

function vetoMargin(w, x) {
  var s = w.intercept;
  for (var k = 0; k < x.length; k++) s += ((x[k] - w.mean[k]) / w.scale[k]) * w.coef[k];
  return s;
}

// Per-map stat array layout (DATA.fields):
// 0 ban_rate_w  1 pick_rate_w  2 first_ban_rate_w  3 first_pick_rate_w
// 4 ban_rate_shrunk  5 pick_rate_shrunk  6 first_ban_rate_shrunk
// 7 first_pick_rate_shrunk  8 winrate_90d  9 games_90d  10 days_since_played
// 11 elo_eff (F1 payload channel; pre-degraded to team pooled at build)
function featVector(t, o, tN, oppLikely, bestOf, lan, rankDiff, actingIsA, step, tEp, oEp, eloMiss) {
  var tEff = t[11], oEff = o[11];
  var eloMapP = 1.0 / (1.0 + Math.pow(10.0, (oEff - tEff) / 400.0));
  return [t[0], t[1], t[2], t[3], t[4], t[5], t[6], t[7],
          tN, t[8], t[9], t[10],
          o[0], o[1], o[3], o[4], o[5], o[7],
          o[8], t[8] - o[8],
          oppLikely, 0, 0, DAYS_CAP,
          bestOf, lan, rankDiff, actingIsA,
          eloMapP, (tEff - tEp) - (oEff - oEp), tEp - oEp, eloMiss,
          step];
}

function cloneObj(src) {
  var out = {};
  for (var k in src) out[k] = src[k];
  return out;
}

function scaleArr(arr, norm) {
  var out = [];
  for (var i = 0; i < arr.length; i++) out.push(arr[i] * norm);
  return out;
}

function scaleObj(obj, norm) {
  var out = {};
  for (var k in obj) out[k] = obj[k] * norm;
  return out;
}

function zerosArr(n) {
  var out = [];
  for (var i = 0; i < n; i++) out.push(0.0);
  return out;
}

// `forced` (optional, 2026-09-25): per-step map index or null/-1. A forced
// step takes ONLY that map with probability 1 -- exact conditioning when the
// forced steps form a PREFIX of the veto (every consistent leaf then shares
// the same prefix probability, which the final normalization removes). The
// v2 page only ever forces a prefix (the veto so far). A forced map that is
// no longer available makes the branch impossible; if nothing survives the
// function returns null. Unforced calls are byte-for-byte the old path.
function enumerateSeries(weights, nPool, fpA, fpB, bestOf, pattern, order, lan, rankDiff, actingIsA, forced) {
  var steps = pattern.slice(0, -1);
  var fps = {A: fpA, B: fpB};
  var margins = [];
  var i, j, mi;
  for (i = 0; i < steps.length; i++) {
    var action = steps.charAt(i) === "r" ? "removed" : "picked";
    var side = order.charAt(i);
    var opp = side === "A" ? "B" : "A";
    var tTeam = fps[side], oTeam = fps[opp];
    var mx = 0.0;
    for (j = 0; j < nPool; j++) {
      var v = oTeam.m[j][1];
      if (v > mx) mx = v;
    }
    var eloMiss = (tTeam.em || oTeam.em) ? 1 : 0;
    var row = [];
    for (mi = 0; mi < nPool; mi++) {
      var ol = (mx > 0.0 && oTeam.m[mi][1] >= mx) ? 1 : 0;
      row.push(vetoMargin(weights[action],
        featVector(tTeam.m[mi], oTeam.m[mi], tTeam.n, ol, bestOf, lan,
                   rankDiff[side], actingIsA[side], i + 1,
                   tTeam.ep, oTeam.ep, eloMiss)));
    }
    margins.push(row);
  }

  var nSteps = steps.length;
  var pPlayed = [], pDecider = [];
  for (j = 0; j < nPool; j++) { pPlayed.push(0.0); pDecider.push(0.0); }
  var firstBan = {A: {}, B: {}};
  var firstPick = {A: {}, B: {}};
  // v2 accumulators (additive; the outputs above are unchanged)
  var pickBy = {A: zerosArr(nPool), B: zerosArr(nPool)};
  var banBy = {A: zerosArr(nPool), B: zerosArr(nPool)};
  var stepDist = [];
  for (i = 0; i < nSteps; i++) stepDist.push(zerosArr(nPool));
  var setDist = {};
  var leaves = [];
  var initial = [];
  for (j = 0; j < nPool; j++) initial.push(j);

  function dfs(idx, remaining, p, picks, fban, fpick, seq) {
    var k, s;
    if (idx === nSteps) {
      var leftover = remaining[0];
      for (k = 0; k < picks.length; k++) pPlayed[picks[k]] += p;
      pPlayed[leftover] += p;
      pDecider[leftover] += p;
      for (s in fban) firstBan[s][fban[s]] = (firstBan[s][fban[s]] || 0.0) + p;
      for (s in fpick) firstPick[s][fpick[s]] = (firstPick[s][fpick[s]] || 0.0) + p;
      for (k = 0; k < seq.length; k++) {
        if (seq[k].verb === "pick") pickBy[seq[k].side][seq[k].map] += p;
        else banBy[seq[k].side][seq[k].map] += p;
        stepDist[k][seq[k].map] += p;
      }
      var sel = picks.concat([leftover]);
      sel.sort(function (x, y) { return x - y; });
      var skey = sel.join(",");
      setDist[skey] = (setDist[skey] || 0.0) + p;
      leaves.push({seq: seq.slice(), decider: leftover, p: p});
      return;
    }
    var ch = steps.charAt(idx);
    var side = order.charAt(idx);
    var mrow = margins[idx];

    function take(m, p2) {
      var fban2 = fban, fpick2 = fpick, picks2 = picks;
      if (ch === "r") {
        if (!(side in fban)) { fban2 = cloneObj(fban); fban2[side] = m; }
      } else {
        picks2 = picks.concat([m]);
        if (!(side in fpick)) { fpick2 = cloneObj(fpick); fpick2[side] = m; }
      }
      seq.push({side: side, verb: ch === "r" ? "ban" : "pick", map: m});
      var rem2 = [];
      for (var k2 = 0; k2 < remaining.length; k2++) {
        if (remaining[k2] !== m) rem2.push(remaining[k2]);
      }
      dfs(idx + 1, rem2, p2, picks2, fban2, fpick2, seq);
      seq.pop();
    }

    var fix = (forced && forced[idx] != null && forced[idx] >= 0) ? forced[idx] : -1;
    if (fix >= 0) {
      if (remaining.indexOf(fix) < 0) return;   // impossible given the prefix
      take(fix, p);
      return;
    }
    var mxs = -Infinity;
    for (k = 0; k < remaining.length; k++) {
      if (mrow[remaining[k]] > mxs) mxs = mrow[remaining[k]];
    }
    var exps = [], tot = 0.0;
    for (k = 0; k < remaining.length; k++) {
      var e = Math.exp(mrow[remaining[k]] - mxs);
      exps.push(e);
      tot += e;
    }
    for (k = 0; k < remaining.length; k++) {
      var p2 = p * (exps[k] / tot);
      if (p2 < PRUNE) continue;
      take(remaining[k], p2);
    }
  }

  dfs(0, initial, 1.0, [], {}, {}, []);
  var total = 0.0;
  for (i = 0; i < leaves.length; i++) total += leaves[i].p;
  if (!(total > 0.0)) return null;
  var norm = 1.0 / total;
  leaves.sort(function (a, b) { return b.p - a.p; });
  var top = [];
  for (i = 0; i < leaves.length && i < 5; i++) {
    top.push({seq: leaves[i].seq, decider: leaves[i].decider, p: leaves[i].p * norm});
  }
  var sets = [];
  for (var sk in setDist) {
    var ids = sk.split(",");
    for (var si = 0; si < ids.length; si++) ids[si] = parseInt(ids[si], 10);
    sets.push({maps: ids, p: setDist[sk] * norm});
  }
  sets.sort(function (a, b) { return b.p - a.p; });
  var sdist = [];
  for (i = 0; i < nSteps; i++) sdist.push(scaleArr(stepDist[i], norm));
  return {
    p_played: scaleArr(pPlayed, norm),
    p_decider: scaleArr(pDecider, norm),
    first_ban: {A: scaleObj(firstBan.A, norm), B: scaleObj(firstBan.B, norm)},
    first_pick: {A: scaleObj(firstPick.A, norm), B: scaleObj(firstPick.B, norm)},
    top_sequences: top,
    kept_mass: total,
    p_pick_by: {A: scaleArr(pickBy.A, norm), B: scaleArr(pickBy.B, norm)},
    p_ban_by: {A: scaleArr(banBy.A, norm), B: scaleArr(banBy.B, norm)},
    step_dist: sdist,
    set_dist: sets.slice(0, 12)
  };
}

// One acting-order template; actingOrder decides which side acts at each
// step ('A' = the step-1 actor), `order` only which TEAM is side A.
// v2 outputs (p_pick_by / p_ban_by keyed team_a/team_b, set_dist, step_dist
// + step_team) ride along additively; mixV2 blends them like the rest.
function mixV2(parts, nPool) {
  // parts: [[result, weight], ...] -> blended v2 fields (null parts skipped)
  var pb = {team_a: zerosArr(nPool), team_b: zerosArr(nPool)};
  var bb = {team_a: zerosArr(nPool), team_b: zerosArr(nPool)};
  var sets = {};
  var i, j;
  for (i = 0; i < parts.length; i++) {
    var r = parts[i][0], w = parts[i][1];
    if (!r || !r.p_pick_by) continue;
    var ts = ["team_a", "team_b"];
    for (var ti = 0; ti < 2; ti++) {
      for (j = 0; j < nPool; j++) {
        pb[ts[ti]][j] += w * r.p_pick_by[ts[ti]][j];
        bb[ts[ti]][j] += w * r.p_ban_by[ts[ti]][j];
      }
    }
    for (j = 0; j < r.set_dist.length; j++) {
      var key = r.set_dist[j].maps.join(",");
      if (!sets[key]) sets[key] = {maps: r.set_dist[j].maps, p: 0.0};
      sets[key].p += w * r.set_dist[j].p;
    }
  }
  var arr = [];
  for (var k in sets) arr.push(sets[k]);
  arr.sort(function (a, b) { return b.p - a.p; });
  return {p_pick_by: pb, p_ban_by: bb, set_dist: arr.slice(0, 12)};
}

function predictOneFlow(weights, nPool, teamA, teamB, bestOf, order, lan, q, actingOrder, forced) {
  if (typeof q !== "number") q = 0.5;  // starter q; 0.5 = historical 50/50
  var pattern = MODAL_FLOW[bestOf][0];

  function run(first) {
    var fp1, fp2, acting, label;
    if (first === "a") {
      fp1 = teamA; fp2 = teamB;
      acting = {A: 1, B: 0};
      label = {A: "team_a", B: "team_b"};
    } else {
      fp1 = teamB; fp2 = teamA;
      acting = {A: 0, B: 1};
      label = {A: "team_b", B: "team_a"};
    }
    var res = enumerateSeries(weights, nPool, fp1, fp2, bestOf, pattern,
                              actingOrder, lan, {A: 0.0, B: 0.0}, acting,
                              forced);
    if (!res) return null;
    var seqs = [];
    for (var i = 0; i < res.top_sequences.length; i++) {
      var t = res.top_sequences[i];
      var steps = [];
      for (var k = 0; k < t.seq.length; k++) {
        steps.push({team: label[t.seq[k].side], verb: t.seq[k].verb, map: t.seq[k].map});
      }
      seqs.push({steps: steps, decider: t.decider, p: t.p});
    }
    var stepTeam = [];
    for (var st = 0; st < res.step_dist.length; st++) {

        var isDec = mm === decIdx;
        var pa = res.p_pick_by ? res.p_pick_by.team_a[mm] : 0;
        var pb = res.p_pick_by ? res.p_pick_by.team_b[mm] : 0;
        var col = isDec ? "var(--dec)" : (pa >= pb ? "var(--a)" : "var(--b)");
        var role = bo1 ? "" : (isDec ? " (decider)" : (pa >= pb ? " (" + esc(S.a.name) + " pick)" : " (" + esc(S.b.name) + " pick)"));
        h += '<span class="chip"><span class="sw" style="background:' + col + '"></span>' +
          esc(mapLabel(POOL[mm])) + '<span class="dim" style="font-weight:400">' + role + '</span></span>';
      }
      h += '</div><div><span class="big">' + pct(top.p) + '</span> <span class="dim">chance of exactly this ' +
        (bo1 ? "map" : "set of maps") + '</span></div></div>';
    } else {
      h += '<div class="dim">No forecast.</div></div>';
    }
    h += '<div><div class="alabel">Next most likely</div><div class="alts">';
    for (var k = 1; k < sets.length && k < 4; k++) {
      var names = [];
      for (var z = 0; z < sets[k].maps.length; z++) names.push(esc(mapLabel(POOL[sets[k].maps[z]])));
      h += '<div><span class="num">' + pct(sets[k].p) + '</span> ' + names.join(" &middot; ") + '</div>';
    }
    if (sets.length < 2) h += '<div class="dim">&ndash;</div>';
    h += '</div><div class="assume" style="margin-top:8px">' + assumptionText(q) + '</div></div>';
    el("answer").innerHTML = h;
  }
  function assumptionText(q) {
    var bits = ["BO" + S.fmt, S.lan ? "LAN" : "online"];
    if (S.forced.length) bits.push(esc(S.walkFirst === "a" ? S.a.name : S.b.name) + " acts first (from the veto so far)");
    else if (S.ord === "a_first") bits.push(esc(S.a.name) + " acts first");
    else if (S.ord === "b_first") bits.push(esc(S.b.name) + " acts first");
    else bits.push("acting order guessed");
    if (S.fmt === 3) bits.push(effFlow() === "ABABBA" ? "Major/PGL final bans" : effFlow() === "mix" ? "final-ban order blended" : "standard final bans");
    if (S.forced.length) bits.push(S.forced.length + " veto step" + (S.forced.length === 1 ? "" : "s") + " entered");
    return "Assuming: " + bits.join(" &middot; ");
  }

  function renderBoard(res) {
    el("legend").innerHTML =
      '<span><i style="background:var(--a)"></i>' + esc(S.a.name) + ' picks</span>' +
      '<span><i style="background:var(--b)"></i>' + esc(S.b.name) + ' picks</span>' +
      (S.fmt === 1 ? '<span><i style="background:var(--dec)"></i>played (last map left)</span>'
                   : '<span><i style="background:var(--dec)"></i>decider (left over)</span>') +
      '<span><i style="background:var(--ban)"></i>banned</span>';
    var idx = [];
    for (var j = 0; j < N; j++) idx.push(j);
    idx.sort(function (x, y) { return res.p_played[y] - res.p_played[x]; });
    var h = "";
    for (var k = 0; k < idx.length; k++) {
      var m = idx[k];
      var pa = res.p_pick_by.team_a[m], pb = res.p_pick_by.team_b[m];
      var pd = res.p_decider[m];
      var ban = Math.max(0, 1 - res.p_played[m]);
      var sub = [];
      if (pa >= 0.005) sub.push('<span class="ca">' + esc(S.a.name) + " pick " + pct(pa) + '</span>');
      if (pb >= 0.005) sub.push('<span class="cb">' + esc(S.b.name) + " pick " + pct(pb) + '</span>');
      if (pd >= 0.005) sub.push('<span class="cd">' + (S.fmt === 1 ? "played " : "decider ") + pct(pd) + '</span>');
      var bA = res.p_ban_by.team_a[m], bB = res.p_ban_by.team_b[m];
      if (ban >= 0.005) sub.push('banned ' + pct(ban) + (bA + bB > 0 ? ' (' + esc(S.a.name) + ' ' + pct(bA) + ', ' + esc(S.b.name) + ' ' + pct(bB) + ')' : ''));
      h += '<div class="brow"><span class="bname">' + esc(mapLabel(POOL[m])) + '</span>' +
        '<span class="btrack" role="img" aria-label="' + esc(mapLabel(POOL[m])) + ': ' +
        Math.round(100 * res.p_played[m]) + ' percent chance it is in the veto">' +
        '<span style="width:' + (100 * pa).toFixed(2) + '%;background:var(--a)"></span>' +
        '<span style="width:' + (100 * pb).toFixed(2) + '%;background:var(--b)"></span>' +
        '<span style="width:' + (100 * pd).toFixed(2) + '%;background:var(--dec)"></span>' +
        '<span style="width:' + (100 * ban).toFixed(2) + '%;background:var(--ban)"></span></span>' +
        '<span class="bp"><span class="num">' + pct(res.p_played[m]) + '</span><small>in veto</small></span>' +
        '<div class="bsub">' + sub.join(" &middot; ") + '</div></div>';
    }
    el("board").innerHTML = h;
    el("board-note").innerHTML = S.fmt === 1 ?
      "In a BO1 the teams ban six maps; the one left is played." :
      "&quot;In veto&quot; = picked by either team or left as the decider. The decider is only played if the series goes the distance.";
  }

  function renderWalk(resW) {
    var pattern = MODAL_FLOW[S.fmt][0];
    var steps = pattern.slice(0, -1);
    var firstName = S.walkFirst === "a" ? S.a.name : S.b.name;
    var otherSide = S.walkFirst === "a" ? "b" : "a";
    var h = '<div class="wtop"><span>' + (S.forced.length ? '<b>' + esc(firstName) + '</b> acted first.' :
      'Enter bans/picks as they happen; every later step updates. Showing <b>' + esc(firstName) + '</b> acting first ' +
      '<button type="button" class="wundo" data-flip="1">(switch)</button>') + '</span>' +
      (S.forced.length ? '<button type="button" class="wreset" data-reset="1">Reset</button>' : '') + '</div>';
    if (!resW) {
      h += '<div class="dim">That sequence is not possible under this format.</div>';
      el("walk").innerHTML = h;
      return;
    }
    for (var i = 0; i < steps.length; i++) {
      var who = resW.step_team[i] === "team_a" ? S.a : S.b;
      var cls = resW.step_team[i] === "team_a" ? "ca" : "cb";
      var verb = steps.charAt(i) === "r" ? "bans" : "picks";
      h += '<div class="wstep"><span class="wn">' + (i + 1) + '</span><div>';
      if (i < S.forced.length) {
        h += '<div class="wdone"><span class="' + cls + '"><b>' + esc(who.name) + '</b></span> ' + verb +
          ' <b>' + esc(mapLabel(POOL[S.forced[i]])) + '</b> <span class="ok">&#10003;</span>' +
          ' <button type="button" class="wundo" data-undo="' + i + '">undo</button></div>';
      } else {
        var row = resW.step_dist[i], opts = [];
        for (var m = 0; m < N; m++) if (row[m] >= 0.01) opts.push({m: m, p: row[m]});
        opts.sort(function (x, y) { return y.p - x.p; });
        var next = i === S.forced.length;
        h += '<div class="wwho"><span class="' + cls + '"><b>' + esc(who.name) + '</b></span> ' + verb +
          (next ? ' <span class="dim">&mdash; tap what happened</span>' : '') + '</div>' +
          '<div class="wopts ' + (next ? "wnext" : "wlater") + '">';
        for (var k = 0; k < opts.length && k < (next ? 7 : 4); k++) {
          h += next ?
            '<button type="button" class="wopt" data-pick="' + opts[k].m + '">' + esc(mapLabel(POOL[opts[k].m])) + '<b>' + pct(opts[k].p) + '</b></button>' :
            '<span class="wopt">' + esc(mapLabel(POOL[opts[k].m])) + '<b>' + pct(opts[k].p) + '</b></span>';
        }
        h += '</div>';
      }
      h += '</div></div>';
    }
    var dist = [];
    for (var d = 0; d < N; d++) if (resW.p_decider[d] >= 0.01) dist.push({m: d, p: resW.p_decider[d]});
    dist.sort(function (x, y) { return y.p - x.p; });
    h += '<div class="wstep"><span class="wn">' + (steps.length + 1) + '</span><div><div class="wwho">' +
      (S.fmt === 1 ? "Map played (last left)" : "Decider (left over)") + '</div><div class="wopts wlater">';
    for (var z = 0; z < dist.length && z < 4; z++) {
      h += '<span class="wopt">' + esc(mapLabel(POOL[dist[z].m])) + '<b>' + pct(dist[z].p) + '</b></span>';
    }
    h += '</div></div></div>';
    el("walk").innerHTML = h;
  }
  el("walk").addEventListener("click", function (e) {
    var b = closest(e.target, "button");
    if (!b) return;
    if (b.hasAttribute("data-pick")) { S.forced.push(parseInt(b.getAttribute("data-pick"), 10)); }
    else if (b.hasAttribute("data-undo")) { S.forced = S.forced.slice(0, parseInt(b.getAttribute("data-undo"), 10)); }
    else if (b.hasAttribute("data-reset")) { S.forced = []; }
    else if (b.hasAttribute("data-flip")) { S.walkFirst = S.walkFirst === "a" ? "b" : "a"; }
    else return;
    update();
  });

  function topOf(d, n) {
    var arr = [];
    for (var k in d) arr.push({m: parseInt(k, 10), p: d[k]});
    arr.sort(function (x, y) { return y.p - x.p; });
    var out = [];
    for (var i = 0; i < arr.length && out.length < n; i++) if (arr[i].p >= 0.01) out.push(arr[i]);
    return out;
  }
  function joinTop(arr) {
    if (!arr.length) return '<span class="dim">&ndash;</span>';
    var parts = [];
    for (var i = 0; i < arr.length; i++) parts.push('<b>' + esc(mapLabel(POOL[arr[i].m])) + '</b> ' + pct(arr[i].p));
    return parts.join(" &middot; ");
  }
  function renderTend(res) {
    var sides = [["team_a", S.a, "var(--a)"], ["team_b", S.b, "var(--b)"]];
    var h = '<div class="tgrid">';
    for (var i = 0; i < 2; i++) {
      var key = sides[i][0], t = sides[i][1];
      h += '<div class="tteam"><h3><span class="sw" style="background:' + sides[i][2] + '"></span>' + esc(t.name) +
        ' <span class="dim" style="font-weight:400">' + (t.r != null ? "HLTV #" + t.r : "unranked") + '</span></h3>' +
        '<div class="tline">Opening ban: ' + joinTop(topOf(res.first_ban[key], 3)) + '</div>' +
        (S.fmt === 1 ? '' : '<div class="tline">First pick: ' + joinTop(topOf(res.first_pick[key], 3)) + '</div>') + '</div>';
    }
    h += '</div><p class="note">The chance each map is this team\'s <b>first</b> ban / pick in the veto above ' +
      '(under 1% hidden).</p>';
    el("tend").innerHTML = h;
  }

  function update() {
    el("team-a").innerHTML = teamBtnHtml(S.a);
    el("team-b").innerHTML = teamBtnHtml(S.b);
    var q = starterQ(DATA.starter, S.a, S.b, S.fmt, S.lan, S.ev);
    if (S.walkFirst === null) {
      S.walkFirst = S.ord === "a_first" ? "a" : S.ord === "b_first" ? "b" : (q >= 0.5 ? "a" : "b");
    }
    renderOpts(q);
    var res, resW;
    var order = S.walkFirst === "a" ? "a_first" : "b_first";
    if (S.forced.length) {
      res = predictMatch(DATA.weights, N, S.a, S.b, S.fmt, order, S.lan, q, walkFlow(), S.forced);
      resW = res;
    } else {
      res = predictMatch(DATA.weights, N, S.a, S.b, S.fmt,
                         S.ord === "auto" ? "unknown" : S.ord, S.lan, q, effFlow(), null);
      resW = predictMatch(DATA.weights, N, S.a, S.b, S.fmt, order, S.lan, q, walkFlow(), null);
    }
    if (!res) { el("answer").innerHTML = '<div class="dim">That veto sequence is not possible.</div>'; return; }
    renderAnswer(res, q);
    renderBoard(res);
    renderWalk(resW);
    renderTend(res);
    el("engine-note").innerHTML = "Explore runs the lighter <b>logit</b> veto model in your browser (trained " +
      esc(String((DATA.meta || {}).trained_at || "").slice(0, 10)) + ", " + DATA.teams.length +
      " teams with 5+ recorded vetos). The Upcoming and Track record views use the logged forecasts of the " +
      "daily <b>GBM</b> model, so the two can differ.";
  }

  // ====================================================== RECORD view
  function recordSummary(c) {
    var R = DATA.record;
    var co = R.cohorts[c] || {n: 0};
    var k = c === "1" ? 1 : c === "5" ? 5 : 3;
    var h = '<div class="headline"><div>';
    if (c === "all") {
      h += '<div class="alabel">All selected maps matched</div><div class="hbig">' + pct(co.n ? co.exact / co.n : null) +
        '</div><div class="hsub">' + co.exact + ' of ' + co.n + ' forecasts (every format; order ignored)</div>';
    } else {
      h += '<div class="alabel">' + (k === 1 ? "Map called" : "All " + k + " maps matched") + '</div><div class="hbig">' +
        pct(co.n ? co.exact / co.n : null) + '</div><div class="hsub">' + co.exact + ' of ' + co.n +
        ' BO' + k + ' forecasts &middot; ' + (k === 1 ? "the one map left after six bans" : "the " + k +
        " maps selected in the veto, order ignored") + '</div>';
    }
    h += '</div><div>';
    if (c !== "all" && co.n) {
      // all hit = green, none = red, partial = lime -> amber by miss share
      var mids = ["#9be26b", "#c9c84a", "#d29922", "#db6d28"];
      var segs = "", leg = "";
      for (var x = k; x >= 0; x--) {
        var cnt = co.dist[String(x)] || 0;
        var share = cnt / co.n;
        var col = x === k ? "#3fb950" : x === 0 ? "#f85149" :
          mids[Math.min(mids.length - 1, Math.floor((k - x - 1) * mids.length / Math.max(1, k - 1)))];
        if (share > 0) segs += '<span style="width:' + (100 * share).toFixed(2) + '%;background:' + col + '" title="' +
          x + ' of ' + k + ': ' + cnt + '">' + (share >= 0.07 ? Math.round(100 * share) + "%" : "") + '</span>';
        leg += '<span><i style="background:' + col + '"></i>' + x + ' of ' + k + ': ' + cnt + ' (' + pct(share) + ')</span>';
      }
      h += '<div class="alabel">How many ' + (k === 1 ? "calls were right" : "of the " + k + " maps matched") + '</div>' +
        '<div class="dbar">' + segs + '</div><div class="dleg">' + leg + '</div>';
    }
    h += '</div></div><div class="tiles">' +
      tile("Opening bans called", co.fb_hit, co.fb_n, "per team call") +
      (c === "1" ? "" : tile("First picks called", co.fp_hit, co.fp_n, "per team call")) +
      (c === "1" ? "" : tile("Decider called", co.dec_hit, co.dec_n, "left-over map; only played if needed")) +
      '</div>';
    return h;
  }
  function tile(label, hit, n, sub) {
    return '<div class="tile"><span class="num">' + pct(n ? hit / n : null) + '</span><span class="tl">' + label +
      '</span><div class="tn">' + hit + ' of ' + n + ' &middot; ' + sub + '</div></div>';
  }
  function markHtml(v) {
    if (v == null) return '<span class="na">n/a</span>';
    return v >= 1 ? '<span class="hit">&#10003; right</span>' : '<span class="miss">&#10007; wrong</span>';
  }
  function receiptHtml(r) {
    var bans = [r.sc.first_ban_hit_a, r.sc.first_ban_hit_b].filter(function (v) { return v != null; });
    var banHits = bans.filter(function (v) { return v >= 1; }).length;
    var verdict = r.k === 1 ? (r.hits ? "map called" : "map missed") : r.hits + " of " + r.k + " maps";
    var vc = r.hits === r.k ? "hit" : (r.hits === 0 ? "miss" : "");
    function mapsList(list, other) {
      var o = {}; for (var i = 0; i < (other || []).length; i++) o[other[i]] = 1;
      var out = [];
      for (var j = 0; j < (list || []).length; j++) out.push(o[list[j]] ? '<b>' + esc(mapLabel(list[j])) + '</b>' : esc(mapLabel(list[j])));
      return out.join(", ") || '<span class="na">&ndash;</span>';
    }
    function cell(v) { return v ? esc(mapLabel(v)) : '<span class="na">&ndash;</span>'; }
    var rows = '<tr><td>Maps selected in the veto <span class="dim">(order ignored)</span></td><td>' + mapsList(r.pred.maps, r.act.maps) +
      '</td><td>' + mapsList(r.act.maps, r.pred.maps) + '</td><td>' + r.hits + ' of ' + r.k + '</td></tr>' +
      '<tr><td><span class="ca">' + esc(r.a) + '</span> opening ban</td><td>' + cell(r.pred.fb_a) + '</td><td>' + cell(r.act.fb_a) + '</td><td>' + markHtml(r.sc.first_ban_hit_a) + '</td></tr>' +
      '<tr><td><span class="cb">' + esc(r.b) + '</span> opening ban</td><td>' + cell(r.pred.fb_b) + '</td><td>' + cell(r.act.fb_b) + '</td><td>' + markHtml(r.sc.first_ban_hit_b) + '</td></tr>';
    if (r.bo !== 1) {
      rows += '<tr><td><span class="ca">' + esc(r.a) + '</span> first pick</td><td>' + cell(r.pred.fp_a) + '</td><td>' + cell(r.act.fp_a) + '</td><td>' + markHtml(r.sc.first_pick_hit_a) + '</td></tr>' +
        '<tr><td><span class="cb">' + esc(r.b) + '</span> first pick</td><td>' + cell(r.pred.fp_b) + '</td><td>' + cell(r.act.fp_b) + '</td><td>' + markHtml(r.sc.first_pick_hit_b) + '</td></tr>' +
        '<tr><td>Decider (left over)</td><td>' + cell(r.pred.dec) + '</td><td>' + cell(r.act.dec) + '</td><td>' + markHtml(r.sc.decider_hit) + '</td></tr>';
    }
    return '<details class="receipt"><summary><span class="rdate">' + shortDate(r.date) + '</span>' +
      '<span class="rbo pill">BO' + r.bo + '</span>' +
      '<span class="rteams">' + esc(r.a) + ' <span class="vs">vs</span> ' + esc(r.b) + '</span>' +
      '<span class="rverd"><span class="num ' + vc + '">' + verdict + '</span>' +
      (bans.length ? ' <span class="dim">&middot; opening bans ' + banHits + '/' + bans.length + '</span>' : '') + '</span></summary>' +
      '<table class="rtable"><thead><tr><th></th><th>Forecast</th><th>Actual</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></details>';
  }
  function renderRecord() {
    var R = DATA.record;
    var box = el("panel-record");
    if (!R || !R.cohorts) { box.innerHTML = '<div class="card empty">No graded forecasts yet.</div>'; return; }
    var co = R.cohorts;
    var chips = '<div class="segs" role="group" aria-label="Format">';
    var order = [["3", "BO3"], ["1", "BO1"], ["5", "BO5"], ["all", "All"]];
    for (var i = 0; i < order.length; i++) {
      var n = (co[order[i][0]] || {}).n || 0;
      chips += '<button type="button" data-cohort="' + order[i][0] + '" aria-pressed="' + (S.cohort === order[i][0]) + '"' +
        (n ? "" : " disabled") + '>' + order[i][1] + ' <span class="dim">' + n + '</span></button>';
    }
    chips += '</div>';
    var c = R.counts;
    var models = [];
    for (var m = 0; m < (R.models || []).length; m++) models.push(esc(R.models[m].kind.toUpperCase()) + " trained " + esc(R.models[m].trained) + " (" + R.models[m].n + ")");
    var h = '<div class="card"><div class="rtop"><h2 style="margin:0">How often the forecasts were right</h2>' + chips + '</div>' +
      recordSummary(S.cohort) +
      '<p class="cover">Every forecast was logged before its match and graded against the real veto' +
      (R.through ? ', results through ' + esc(R.through) : '') + '. ' + c.graded + ' graded &middot; ' +
      c.awaiting + ' awaiting results &middot; ' + c.upcoming + ' upcoming &middot; ' + c.expired +
      ' expired (no veto published) &middot; ' + c["void"] + ' voided (logged after the start). ' +
      (models.length ? 'Models: ' + models.join("; ") + '.' : '') + '</p></div>';
    h += '<div class="card"><div class="rtop"><h2 style="margin:0">Receipts</h2>' +
      '<input type="search" class="rsearch" id="rsearch" aria-label="Filter receipts by team" placeholder="Filter by team" value="' + esc(S.query) + '"></div>' +
      '<div id="rlist"></div></div>';
    box.innerHTML = h;
    renderReceipts();
    var inp = el("rsearch");
    inp.addEventListener("input", function () { S.query = inp.value; S.shown = 30; renderReceipts(); });
  }
  function renderReceipts() {
    var R = DATA.record;
    var q = S.query.toLowerCase();
    var list = [];
    for (var i = 0; i < R.rows.length; i++) {
      var r = R.rows[i];
      if (S.cohort !== "all" && String(r.bo) !== S.cohort) continue;
      if (q && (r.a + " " + r.b).toLowerCase().indexOf(q) === -1) continue;
      list.push(r);
    }
    var h = "";
    for (var j = 0; j < list.length && j < S.shown; j++) h += receiptHtml(list[j]);
    if (!list.length) h = '<div class="dim" style="padding:10px 0">No receipts match.</div>';
    if (list.length > S.shown) h += '<button type="button" class="more" data-more="1">Show more (' + (list.length - S.shown) + ' left)</button>';
    if (R.rows_total > R.rows.length) h += '<p class="note">Showing the newest ' + R.rows.length + ' of ' + R.rows_total + ' graded receipts; the summary above counts all of them.</p>';
    el("rlist").innerHTML = h;
  }
  el("panel-record").addEventListener("click", function (e) {
    var b = closest(e.target, "button");
    if (!b) return;
    if (b.hasAttribute("data-cohort")) { S.cohort = b.getAttribute("data-cohort"); S.shown = 30; renderRecord(); }
    else if (b.hasAttribute("data-more")) { S.shown += 30; renderReceipts(); }
  });

  // ================================================================ boot
  renderUpcoming();
  renderRecord();
  var start = (location.hash || "").replace("#", "");
  if (TABS.indexOf(start) === -1) start = (DATA.upcoming && DATA.upcoming.length) ? "upcoming" : "explore";
  setTab(start, false);
  if (start !== "explore") update();
  window.addEventListener("hashchange", function () {
    var h = (location.hash || "").replace("#", "");
    if (TABS.indexOf(h) !== -1 && h !== S.tab) setTab(h, false);
  });

  // Hidden self-test (same contract as v1): recompute the embedded fixtures.
  try {
    var worst = 0.0;
    for (var fi = 0; fi < DATA.fixtures.length; fi++) {
      var fx = DATA.fixtures[fi];
      var qf = starterQ(DATA.starter, byId[fx.a], byId[fx.b], fx.best_of, fx.lan, fx.ev || "other");
      var rr = predictMatch(DATA.weights, N, byId[fx.a], byId[fx.b], fx.best_of, fx.order, fx.lan, qf, fx.flow || null);
      for (var j2 = 0; j2 < N; j2++) {
        var dd = Math.abs(rr.p_played[j2] - fx.p_played[POOL[j2]]);
        if (dd > worst) worst = dd;
      }
    }
    if (worst > 1e-6) console.warn("veto self-test FAILED: max |dP(played)| = " + worst);
    else console.log("veto self-test passed: max |dP(played)| = " + worst.toExponential(2));
  } catch (err) { console.warn("veto self-test error: " + err); }
})();</script>
